[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sems-plus-client"
version = "0.1.0"
description = "Async client for the GoodWe SEMS+ cloud API"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Hayden" }]
keywords = ["home-assistant", "goodwe", "sems", "solar", "inverter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/haids3/sems-plus-client"
Repository = "https://github.com/haids3/sems-plus-client"
Issues = "https://github.com/haids3/sems-plus-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sems_plus_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["sems_plus_client"]
